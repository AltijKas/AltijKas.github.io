<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>

<script>
setTimeout(function(){
window.location.href="https://link.me/maudsmit";
},4000);
</script>

<style>
body{
background:white;
color:black;
font-family:Arial, sans-serif;
text-align:center;
padding-top:140px;
margin:0;
}

.title{
font-size:22px;
font-weight:500;
}

.arrow{
width:30px;
height:30px;
border-left:4px solid black;
border-top:4px solid black;
transform:rotate(45deg);
margin:30px auto;
animation:move 1s infinite;
}

@keyframes move{
0%{transform:rotate(45deg) translateY(0);}
50%{transform:rotate(45deg) translateY(-8px);}
100%{transform:rotate(45deg) translateY(0);}
}

.small{
font-size:14px;
opacity:0.6;
margin-top:20px;
}
</style>

</head>

<body>

<div class="title">Tap (…) and open in browser</div>

<div class="arrow"></div>

<div class="small">Loading secure page...</div>

</body>
</html>
